name: daily-release
# Closes each UTC day as an immutable release `ledger-YYYY-MM-DD`: that day's ledger file and the
# newest chain hash. (The snapshot data themselves are immutable releases `snap-*`, made by the
# publisher at each snapshot.) Skipped until the ledger has its first row.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day YYYY-MM-DD (default: yesterday)"
        required: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          DAY_IN: ${{ github.event.inputs.day }}
        run: |
          day="${DAY_IN:-$(date -u -d yesterday +%F)}"
          tag="ledger-$day"
          first=$(ls ledger/*.jsonl 2>/dev/null | head -1 || true)
          if [ -z "$first" ] || [[ "$(basename "$first" .jsonl)" > "$day" ]]; then echo "no ledger up to $day yet, nothing to release"; exit 0; fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          python3 scripts/verify_public.py --remote --days 2 --token "$GH_TOKEN"
          head=$(python3 -c "import json,pathlib;rows=[json.loads(l) for p in sorted(pathlib.Path('ledger').glob('*.jsonl')) if p.stem<='$day' for l in p.read_text().splitlines() if l.strip()];print(rows[-1]['chain_hash'] if rows else '')")
          files=""
          [ -f "ledger/$day.jsonl" ] && files="ledger/$day.jsonl"
          printf '%s\n' "$head" > chain-head.txt
          n=0; [ -f "ledger/$day.jsonl" ] && n=$(wc -l < "ledger/$day.jsonl")
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Ledger $day" \
            --notes "Ledger of $day (UTC): $n snapshot rows. Chain head after this day: $head. Snapshot data: releases snap-${day//-/}T*. How to verify: README.md." $files chain-head.txt
          gh release edit "$tag" --draft=false
          gh release verify "$tag" || echo "attestation not available yet"
