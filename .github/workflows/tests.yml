name: tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/tests.yml"]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install polars==2.0.0 pytest
      - run: python -m pytest -q tests
